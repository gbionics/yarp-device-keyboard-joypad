[workspace]
authors = ["Team hermes - GBionics"]
channels = ["conda-forge"]
name = "yarp-device-keyboard-joypad"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76.2"

[activation.env]
CMAKE_BUILD_TYPE = "Release"
# ccache support
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

[target.unix.activation.env]
CMAKE_INSTALL_PREFIX = "$CONDA_PREFIX"
CCACHE_BASEDIR = "$PIXI_PROJECT_ROOT"

[target.win.activation.env]
CMAKE_INSTALL_PREFIX = "%CONDA_PREFIX%\\Library"
CCACHE_BASEDIR = "%PIXI_PROJECT_ROOT%"

[tasks]
configure = { cmd = [
  "cmake",
  "-G",
  "Ninja",
  "-DBUILD_TESTING:BOOL=ON",
  "-DUSE_VENDORED_IMGUI:BOOL=OFF",
  "-S",
  ".",
  "-B",
  ".build",
] }
build = { cmd = ["cmake", "--build", ".build", "--config", "Release"], depends-on = ["configure"] }
install = { cmd = ["cmake", "--install", ".build", "--config", "Release"], depends-on = ["build"] }
uninstall = { cmd = ["cmake", "--build", ".build", "--target", "uninstall"] }

[dependencies]
cmake = "*"
c-compiler = "*"
cxx-compiler = "*"
ninja = "*"
pkg-config = "*"
ccache = "*"
yarp = ">=3.4.0"
ycm-cmake-modules = "*"
glfw = "*"
glew = "*"
imgui = "*"

dinrail = { git = "https://github.com/gbionics/dinrail.git", rev = "2ff2ae988a7ef01f7ec61ac1be91710d8d6813c2" }

[target.linux.dependencies]
libgl-devel = "*"
vulkan-headers = "*"

[target.osx.dependencies]
libvulkan-headers = "*"

# dinrail is not available on conda-forge, so depend on source.
# Furthermore, we redefined the metadata as we want to compile without YARP support,
# to workaround https://github.com/gbionics/yarp-device-keyboard-joypad/pull/13#issuecomment-5406943040
# Drop this once https://github.com/conda-forge/staged-recipes/pull/34241 is merged
[dependencies.dinrail]
git = "https://github.com/gbionics/dinrail.git"
rev = "2ff2ae988a7ef01f7ec61ac1be91710d8d6813c2"

# This is an inline replacement for Dinrail's [package] definition.
[dependencies.dinrail.package]
version = "0.1.0"
description = "A lightweight library for robot device abstractions"

[dependencies.dinrail.package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[dependencies.dinrail.package.build-dependencies]
ycm-cmake-modules = "*"

[dependencies.dinrail.package.host-dependencies]
libsharedlibpp = "*"
cli11 = "*"
spdlog = "*"
