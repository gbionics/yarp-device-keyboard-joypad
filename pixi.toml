[workspace]
authors = ["Team hermes - GBionics"]
channels = ["conda-forge"]
name = "yarp-device-keyboard-joypad"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]
requires-pixi = ">=0.76.2"

[activation.env]
CMAKE_BUILD_TYPE = "Release"
# ccache support
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"

[target.unix.activation.env]
CMAKE_INSTALL_PREFIX = "$CONDA_PREFIX"
CCACHE_BASEDIR = "$PIXI_PROJECT_ROOT"

[target.win.activation.env]
CMAKE_INSTALL_PREFIX = "%CONDA_PREFIX%\\Library"
CCACHE_BASEDIR = "%PIXI_PROJECT_ROOT%"

[tasks]
configure = { cmd = [
  "cmake",
  "-G",
  "Ninja",
  "-DBUILD_TESTING:BOOL=ON",
  "-DUSE_VENDORED_IMGUI:BOOL=OFF",
  "-S",
  ".",
  "-B",
  ".build",
] }
build = { cmd = ["cmake", "--build", ".build", "--config", "Release"], depends-on = ["configure"] }
install = { cmd = ["cmake", "--install", ".build", "--config", "Release"], depends-on = ["build"] }
uninstall = { cmd = ["cmake", "--build", ".build", "--target", "uninstall"] }

[dependencies]
cmake = "*"
c-compiler = "*"
cxx-compiler = "*"
ninja = "*"
pkg-config = "*"
ccache = "*"
yarp = ">=3.4.0"
ycm-cmake-modules = "*"
glfw = "*"
glew = "*"
imgui = "*"
libvulkan-headers = "*"
libvulkan-loader = "*"
libdinrail = "*"

[target.linux.dependencies]
libgl-devel = "*"
