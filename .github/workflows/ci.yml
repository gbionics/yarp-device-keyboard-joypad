name: C++ CI Workflow with pixi dependencies

on:
  workflow_dispatch:
    inputs:
      delete_pixi_lock:
        description: 'If true, delete pixi.lock, to test against the latest version of dependencies.'
        required: true
        default: 'false'
  push:
  pull_request:
  schedule:
  # * is a special character in YAML so you have to quote this string
  # Execute a "nightly" build at 2 AM UTC
  - cron:  '0 2 * * *'

jobs:
  build:
    name: '[${{ matrix.os }}@pixi]'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Delete pixi.lock on scheduled jobs or if delete_pixi_lock is true
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.delete_pixi_lock == 'true')
      shell: bash
      run: |
        rm pixi.lock

    - uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.76.2

    - name: Install global ccache
      shell: bash
      run: |
        pixi global install ccache

    - uses: Chocobo1/setup-ccache-action@v1
      with:
        install_ccache: false
        update_packager_index: false

    - name: C++ build and test
      shell: bash
      run: |
        pixi run build

